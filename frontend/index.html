<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Brightloop</title>
    <style>
      :root {
        --bg: #F8FAFF;
        --blue: #2563EB;
        --cyan: #0EA5E9;
        --violet: #7C3AED;
        --navy: #0B1B3F;
      }
      /* ---------- Splash Screen Styles ---------- */
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
        background: var(--bg);
        overflow: hidden;
        z-index: 9999;
        animation: splashOut 0.7s cubic-bezier(0.7, 0, 0.3, 1) 4.1s forwards;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0;
        animation: glowIn 1.6s ease 0.1s forwards;
        pointer-events: none;
      }
      .g1 {
        width: 46vmax;
        height: 46vmax;
        background: var(--cyan);
        top: -18vmax;
        right: -12vmax;
        --o: 0.28;
      }
      .g2 {
        width: 42vmax;
        height: 42vmax;
        background: var(--violet);
        bottom: -20vmax;
        left: -12vmax;
        --o: 0.22;
      }
      .g3 {
        width: 30vmax;
        height: 30vmax;
        background: var(--blue);
        top: 30%;
        left: 35%;
        --o: 0.14;
      }
      @keyframes glowIn {
        to {
          opacity: var(--o);
        }
      }

      .stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 2.4vw, 34px);
        flex-wrap: wrap;
        padding: 0 24px;
      }

      /* icon + loop rings */
      .mark {
        position: relative;
        width: clamp(96px, 13vw, 170px);
        aspect-ratio: 1/1;
        display: grid;
        place-items: center;
      }
      .mark img {
        position: relative;
        z-index: 2;
        width: 100%;
        display: block;
        opacity: 0;
        animation: markIn 1s cubic-bezier(0.2, 1.2, 0.3, 1) 0.35s forwards;
      }
      .orbit {
        position: absolute;
        inset: -14%;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--blue);
        border-right-color: var(--violet);
        opacity: 0;
        animation: orbitIn 0.5s ease 0.3s forwards, spin 1.6s cubic-bezier(0.5, 0.1, 0.3, 1) 0.3s 2;
      }
      .pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--blue);
        opacity: 0;
        animation: pulse 1.4s ease-out 1.2s 2;
      }
      @keyframes markIn {
        0% {
          opacity: 0;
          transform: scale(0.4) rotate(-120deg);
        }
        100% {
          opacity: 1;
          transform: scale(1) rotate(0);
        }
      }
      @keyframes orbitIn {
        to {
          opacity: 0.9;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0% {
          opacity: 0.5;
          transform: scale(0.9);
        }
        100% {
          opacity: 0;
          transform: scale(1.9);
        }
      }

      /* wordmark reveal + shine */
      .word {
        position: relative;
        width: clamp(260px, 41vw, 580px);
        overflow: hidden;
        clip-path: inset(0 100% 0 0);
        animation: reveal 1s cubic-bezier(0.6, 0, 0.2, 1) 1s forwards;
      }
      .word img {
        width: 100%;
        display: block;
        transform: translateX(-24px);
        animation: slideIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) 1s forwards;
      }
      .word::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 30%;
        left: -40%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.85), transparent);
        animation: shine 0.9s ease 2.1s forwards;
      }
      @keyframes reveal {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes slideIn {
        to {
          transform: none;
        }
      }
      @keyframes shine {
        to {
          left: 130%;
        }
      }

      /* loader */
      .loader {
        position: relative;
        width: min(280px, 60vw);
        height: 5px;
        border-radius: 5px;
        background: #DBE6FF;
        overflow: hidden;
        opacity: 0;
        animation: fade 0.4s ease 1.6s forwards;
      }
      .loader i {
        position: absolute;
        inset: 0;
        border-radius: 5px;
        transform-origin: left;
        transform: scaleX(0);
        background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
        animation: load 2.2s cubic-bezier(0.5, 0, 0.2, 1) 1.7s forwards;
      }
      @keyframes fade {
        to {
          opacity: 1;
        }
      }
      @keyframes load {
        to {
          transform: scaleX(1);
        }
      }

      /* exit */
      @keyframes splashOut {
        to {
          opacity: 0;
          transform: scale(1.06);
          visibility: hidden;
          pointer-events: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * {
          animation-duration: 0.01s !important;
          animation-delay: 0s !important;
        }
        #splash {
          animation-delay: 0.8s !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#FAFAFA] font-sans antialiased text-[#111827]">
    <!-- Brightloop Animated Splash Screen -->
    <div id="splash" aria-label="Brightloop is loading" role="status">
      <span class="glow g1"></span>
      <span class="glow g2"></span>
      <span class="glow g3"></span>
      <div class="stage">
        <div class="mark">
          <span class="orbit"></span>
          <span class="pulse"></span>
          <img alt="Brightloop Mark" src="/splash-mark.png" />
        </div>
        <div class="word">
          <img alt="Brightloop - Manage. Automate. Grow." src="/logo.png" />
        </div>
      </div>
      <div class="loader">
        <i></i>
      </div>
    </div>

    <!-- App Root -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.addEventListener('animationend', function(e) {
            if (e.animationName === 'splashOut') {
              splash.style.display = 'none';
              splash.remove();
            }
          });
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.style.display = 'none';
              splash.remove();
            }
          }, 5000);
        }
      })();
    </script>
  </body>
</html>
